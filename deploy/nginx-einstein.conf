# A TLS reverse proxy in front of the validator (which listens on 127.0.0.1:8793). Start the daemon
# with --trusted-proxy 127.0.0.1 so the per-address limits count the real client address.
limit_req_zone  $binary_remote_addr zone=einstein_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=einstein_conn:10m;

server {
    listen 443 ssl;
    server_name VALIDATOR_HOST;
    ssl_certificate     /etc/ssl/VALIDATOR_HOST/fullchain.pem;
    ssl_certificate_key /etc/ssl/VALIDATOR_HOST/privkey.pem;

    client_max_body_size  4m;
    client_header_timeout 20s;
    client_body_timeout   20s;

    location /v1/ {
        limit_req  zone=einstein_req burst=40 nodelay;
        limit_conn einstein_conn 16;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 90s;
        proxy_pass http://127.0.0.1:8793;
    }
}
